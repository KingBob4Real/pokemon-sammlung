name = "pokemon-sammlung"
main = "src/index.js"
account_id = "3eff4ed7c54a174af6d042c750ebee99" # nicht geheim; nötig fürs automatische Veröffentlichen per GitHub Action
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "pokemon-sammlung"
database_id = "a8fae683-d5c4-4469-8087-dcea378a8ea1"
migrations_dir = "migrations"

# Logs im Cloudflare-Dashboard (Workers → Logs), z. B. was der Scanner gelesen hat. Gratis: 3 Tage.
[observability]
enabled = true

# Workers AI für den Karten-Scanner
[ai]
binding = "AI"

# Tageslimits für Scans (UTC-Tag). Gratis-Tarif: 10.000 Neurons/Tag für Live + Dev zusammen, ein Scan kostet
# höchstens ~10,3 → Live-Gesamt + Dev-Gesamt ≤ 960 hält das sicher ein (Rechnung in src/config.js).
[vars]
SCANS_PER_DAY = "360"        # pro Person
SCANS_PER_DAY_TOTAL = "900"  # alle Personen zusammen

# Dev-Stufe (Branch develop): eigener Worker + eigene Datenbank. Aufruf mit --env dev.
[env.dev]
name = "pokemon-sammlung-dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "pokemon-sammlung-dev"
database_id = "2de88fcf-125f-4480-9aee-37252ce298ba"
migrations_dir = "migrations"

[env.dev.ai]
binding = "AI"

[env.dev.vars]
SCANS_PER_DAY = "60"
SCANS_PER_DAY_TOTAL = "60"   # Dev braucht nur zum Testen, der Rest des Gratis-Tarifs bleibt für Live
