# Tests ohne Netz bei jedem Push (jeder Branch) – ein rotes Kreuz am Commit, bevor etwas auf Dev oder live geht.
# Auch Teil von deploy.yml (der Branch, der veröffentlicht wird). Veröffentlicht wird in pages.yml bzw. backend.yml;
# dort laufen die Tests vor dem Veröffentlichen noch einmal.
name: Tests

on:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: "Test: Frontend + Backend"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout: ${{ github.ref_name }}"
        uses: actions/checkout@v7
      - name: "Setup: Node 24"
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: "Test: Frontend (Katalog, Sammlung, Speicher, Personen, Scanner)"
        run: for t in frontend/test/*.test.mjs; do echo "▶ $t"; node "$t"; done
      - name: "Test: Backend (Sicherheit, Exemplare, Abgleich)"
        run: for t in backend/test/*.test.mjs; do echo "▶ $t"; node "$t"; done
