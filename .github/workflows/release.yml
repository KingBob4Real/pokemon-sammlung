# Release in einem Lauf: Test → Backend → Frontend, für Dev oder Live. Von Hand starten: Actions → „Release“ → Run workflow,
# Branch **main** lassen (GitHub Pages veröffentlicht nur Läufe von main) und das Ziel wählen:
#   dev  – Branch develop → Dev-Backend + pokekiste.app/dev/
#   live – Branch main    → Live-Backend + pokekiste.app
# Die Schritte selbst stehen in test.yml, backend.yml und pages.yml – die laufen weiter auch einzeln (bei jedem Push).
# Backend vor dem Frontend: neue Datenbank-Spalten sind da, bevor die neue App sie schickt.
# Hinweis: Die Seite enthält immer main unter / und develop unter /dev/ – ein Dev-Release baut Live also unverändert neu mit.
name: Release

run-name: "Release ${{ inputs.ziel == 'live' && 'Live' || 'Dev' }} – Frontend + Backend"

on:
  workflow_dispatch:
    inputs:
      ziel:
        description: "Wohin? dev = develop → Dev, live = main → Live"
        type: choice
        options: [dev, live]
        default: dev

# was die aufgerufenen Abläufe brauchen (Pages veröffentlichen, Lauf auf main anstoßen)
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  start:
    name: "🎯 Start: Release ${{ inputs.ziel }} prüfen"
    runs-on: ubuntu-latest
    steps:
      - name: "🎯 Von main gestartet?"
        if: github.ref_name != 'main'
        run: |
          echo "::error::Release bitte mit Branch main starten (Auswahl „Use workflow from“) – GitHub Pages veröffentlicht nur Läufe von main. Das Ziel (dev/live) wählst du darunter."
          exit 1
      - name: "📝 Übersicht"
        run: |
          branch=${{ inputs.ziel == 'live' && 'main' || 'develop' }}
          echo "## 🚀 Release ${{ inputs.ziel }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch \`$branch\` → Backend ${{ inputs.ziel }} → Frontend (\`main\` unter /, \`develop\` unter /dev/)" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: "🧪 Test"
    needs: start
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.ziel == 'live' && 'main' || 'develop' }}

  backend:
    name: "⚙️ Backend"
    needs: test
    uses: ./.github/workflows/backend.yml
    with:
      ziel: ${{ inputs.ziel }}
    secrets: inherit

  frontend:
    name: "🌐 Frontend"
    needs: backend
    uses: ./.github/workflows/pages.yml
    secrets: inherit
