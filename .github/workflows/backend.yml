# Veröffentlicht das Backend bei Cloudflare (Datenbank-Migrationen + Worker), sobald sich backend/ ändert.
# main → Live-Backend, develop → Dev-Backend (wrangler.toml, [env.dev]).
# Braucht das Repository-Secret CLOUDFLARE_API_TOKEN – ohne Token wird nur gewarnt, nichts veröffentlicht.
name: Backend zu Cloudflare

on:
  push:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.token.outputs.ready }}
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret CLOUDFLARE_API_TOKEN fehlt – Backend wird nicht veröffentlicht (Anleitung in der README)."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STAGE: ${{ github.ref_name != 'main' && '--env dev' || '' }}
      URL: https://pokemon-sammlung${{ github.ref_name != 'main' && '-dev' || '' }}.pokemon-sammlung-backend.workers.dev/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Datenbank-Migrationen
        run: npx wrangler d1 migrations apply DB --remote $STAGE
      - name: Worker veröffentlichen
        run: npx wrangler deploy $STAGE
      - name: Kurztest
        run: sleep 15 && curl -fsS "$URL"
