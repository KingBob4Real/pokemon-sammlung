# Veröffentlicht das Backend bei Cloudflare (Datenbank-Migrationen + Worker), sobald sich backend/ ändert.
# main → Live-Backend, develop → Dev-Backend (wrangler.toml, [env.dev]). Aus deploy.yml heraus bestimmt `ziel` (dev/live),
# welcher Branch wohin geht (develop bzw. main – deploy.yml hat sie vorher auf den gewählten Branch gesetzt).
# Braucht das Repository-Secret CLOUDFLARE_API_TOKEN – ohne Token wird nur gewarnt, nichts veröffentlicht.
name: Backend zu Cloudflare

on:
  push:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ziel:
        description: "dev (Branch develop → Dev-Backend) oder live (Branch main → Live-Backend)"
        type: string
        required: true

# nur lesen – veröffentlicht wird mit dem Cloudflare-Token, nicht mit dem GitHub-Token
permissions:
  contents: read

# Ziel: aus deploy.yml, sonst vom Branch (main = live, alles andere = dev). Pro Ziel immer nur ein Deploy auf einmal.
concurrency:
  group: backend-${{ inputs.ziel || (github.ref_name == 'main' && 'live' || 'dev') }}
  cancel-in-progress: false

jobs:
  check:
    name: "🔑 Vorbereitung: Cloudflare-Token prüfen"
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.token.outputs.ready }}
    steps:
      - name: "🔑 Secret CLOUDFLARE_API_TOKEN vorhanden?"
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret CLOUDFLARE_API_TOKEN fehlt – Backend wird nicht veröffentlicht (Anleitung in der README)."
          fi

  deploy:
    name: "🚀 Deployment: Worker + Datenbank (${{ inputs.ziel || (github.ref_name == 'main' && 'live' || 'dev') }})"
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZIEL: ${{ inputs.ziel || (github.ref_name == 'main' && 'live' || 'dev') }}
    steps:
      - name: "📥 Checkout: ${{ inputs.ziel == 'live' && 'main' || inputs.ziel == 'dev' && 'develop' || github.ref_name }}"
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ziel == 'live' && 'main' || inputs.ziel == 'dev' && 'develop' || '' }}
      - name: "🎯 Ziel bestimmen: Dev oder Live"
        run: |
          if [ "$ZIEL" = live ]; then
            echo "STAGE=" >> "$GITHUB_ENV"
            echo "URL=https://pokemon-sammlung.pokemon-sammlung-backend.workers.dev/" >> "$GITHUB_ENV"
          else
            echo "STAGE=--env dev" >> "$GITHUB_ENV"
            echo "URL=https://pokemon-sammlung-dev.pokemon-sammlung-backend.workers.dev/" >> "$GITHUB_ENV"
          fi
          echo "Ziel: $ZIEL"
      - name: "🧰 Setup: Node 24 mit npm-Cache"
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: "📦 Build: Abhängigkeiten installieren (npm ci)"
        run: npm ci
      - name: "🧪 Test: Backend ohne Netz"
        run: for t in test/*.test.mjs; do echo "▶ $t"; node "$t"; done
      - name: "🗄️ Deployment: Datenbank-Migrationen (D1)"
        run: npx wrangler d1 migrations apply DB --remote $STAGE
      - name: "🚀 Deployment: Worker veröffentlichen"
        run: npx wrangler deploy $STAGE
      - name: "🔎 Kontrolle: Backend antwortet"
        run: |
          sleep 15
          curl -fsS "$URL"
          echo "### ⚙️ Backend ($ZIEL) veröffentlicht" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`$(git rev-parse --short HEAD)\` · $URL" >> "$GITHUB_STEP_SUMMARY"
